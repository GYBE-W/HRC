---
- name: Atualizar Stack com Node Exporter
  hosts: nodes
  become: true
  tasks:

    - name: Atualizar o ficheiro docker-compose.yml
      ansible.builtin.copy:
        dest: /opt/monitorizacao/docker-compose.yml
        content: |
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              volumes:
                - /opt/monitorizacao/prometheus.yml:/etc/prometheus/prometheus.yml
              ports:
                - "9090:9090"
              restart: unless-stopped

            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              ports:
                - "3000:3000"
              restart: unless-stopped

            node-exporter:
              image: prom/node-exporter:latest
              container_name: node-exporter
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/rootfs:ro
              command:
                - '--path.procfs=/host/proc'
                - '--path.rootfs=/rootfs'
                - '--path.sysfs=/host/sys'
                - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
              ports:
                - "9100:9100"
              restart: unless-stopped

    - name: Criar ficheiro de configuracao do Prometheus
      ansible.builtin.copy:
        dest: /opt/monitorizacao/prometheus.yml
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: 'rocky-linux'
              static_configs:
                - targets: ['node-exporter:9100']

    - name: Reiniciar os contentores com as novidades
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: /opt/monitorizacao
