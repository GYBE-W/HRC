---
- name: Instalar e Configurar o Docker
  hosts: nodes
  become: true
  tasks:

    - name: Garantir que o dnf-plugins-core está instalado
      dnf:
        name: dnf-plugins-core
        state: present

    - name: Adicionar o repositório oficial do Docker
      ansible.builtin.command:
        cmd: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Instalar o Docker e o Docker Compose CLI
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Garantir que o serviço do Docker está ativo e arranca no boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
